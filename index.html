<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현장 작업일보 등록</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white shadow-lg rounded-2xl w-full max-w-md p-6 border border-slate-200">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-600">작업일보 모바일 등록</h1>
            <p class="text-xs text-slate-400 mt-1">현장 작업 정보 등록 화면</p>
        </div>

        <form id="logForm" class="space-y-4">
            
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">작업일자</label>
                    <input type="date" id="workDate" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">작업자명</label>
                    <input type="text" id="name" placeholder="이름 입력" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">사번</label>
                    <input type="text" id="empId" placeholder="예: H1234" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">공정</label>
                    <select id="proc" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="프레스">프레스</option>
                        <option value="조립">조립</option>
                        <option value="검사">검사</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">금형번호</label>
                <input type="text" id="mold" placeholder="금형번호 5자리 입력 (예: 26020)" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-lg border border-slate-100">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">차종 (자동)</label>
                    <input type="text" id="car" readonly class="w-full p-2 border-none bg-transparent text-sm text-slate-600 font-bold focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">품명 (자동)</label>
                    <input type="text" id="part" readonly class="w-full p-2 border-none bg-transparent text-sm text-slate-600 font-bold focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">작업구분</label>
                    <select id="cat" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50">
                        <option value="정상작업">정상작업</option>
                        <option value="비가동">비가동</option>
                        <option value="셋팅">셋팅</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">작업코드</label>
                    <input type="text" id="code" placeholder="예: A01" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">시간 (분 단위)</label>
                    <input type="number" id="time" placeholder="예: 120" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">비고</label>
                    <input type="text" id="remark" placeholder="특이사항 기재" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3 bg-blue-600 text-white rounded-lg font-bold text-sm hover:bg-blue-700 transition duration-200">
                작업일보 제출하기
            </button>
        </form>
    </div>

    <script>
        // ==========================================================
        // ⚠️ [입력 단계] 아래 두 곳에 본인의 정보를 오타 신경 쓰지 말고 입력해 주세요!
        // ==========================================================
        const INPUT_URL = "https://qvkyfrmwcqhqwccsikbl.supabase.co";
        const INPUT_KEY = "sb_publishable_kNJKGSQFF3SgUf_13ESx1Q_HH3v02Bn";
        const TABLE_NAME = "worklog"; 
        // ==========================================================

        // 🧼 [자동 세척기] 한글, 보이지 않는 줄바꿈, 특수 공백을 모조리 제거하는 함수
        const clean = (str) => {
            if (!str) return "";
            return str
                .trim()                                      // 1. 앞뒤 공백 제거
                .replace(/[\u200B-\u200D\uFEFF\u00A0]/g, "") // 2. 숨겨진 특수 유니코드 공백 제거
                .replace(/[^\x21-\x7E]/g, "");               // 3. 오직 영문, 숫자, 기본 기호만 남기고 한글 및 기타 문자 전부 강제 삭제
        };

        // 입력받은 정보 자동 정제
        const SUPABASE_URL = clean(INPUT_URL);
        const SUPABASE_KEY = clean(INPUT_KEY);

        // 정제 결과 디버깅 콘솔 출력 (개발자 도구 F12에서 확인 가능)
        console.log("🧼 주소 세척 결과:", SUPABASE_URL);
        console.log("🧼 키 세척 결과 길이:", SUPABASE_KEY.length);

        // Supabase 초기화 연결
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // 금형번호 기준 자동완성 데이터베이스
        const moldCache = {
            "26020": { car: "AI4", part: "RING SUNROOF REINF" },
            "26030": { car: "AI4", part: "MEMBER CTR PILAR" },
            "27010": { car: "CN7", part: "BRKT COMPRESSOR" },
            "28050": { car: "MQ4", part: "PANEL REAR FLOOR" }
        };

        // 기본 날짜를 '오늘 날짜'로 자동 세팅
        document.getElementById('workDate').value = new Date().toISOString().substring(0, 10);

        // 금형번호 입력 시 자동 완성 기능
        const moldInput = document.getElementById('mold');
        moldInput.addEventListener('input', function() {
            const moldValue = this.value.trim();
            const carInput = document.getElementById('car');
            const partInput = document.getElementById('part');

            if (moldCache[moldValue]) {
                carInput.value = moldCache[moldValue].car;
                partInput.value = moldCache[moldValue].part;
            } else {
                carInput.value = "";
                partInput.value = "";
            }
        });

        // [제출하기] 클릭 시 실행
        const form = document.getElementById('logForm');
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "전송 중...";

            // Supabase 테이블 스키마에 맞춘 데이터 구조
            const formData = {
                date: document.getElementById('workDate').value,      
                name: document.getElementById('name').value,          
                Id: document.getElementById('empId').value,            
                proc: document.getElementById('proc').value,          
                swmno: document.getElementById('mold').value,         
                car: document.getElementById('car').value || "미등록금형",
                part: document.getElementById('part').value || "미등록품명",
                cat: document.getElementById('cat').value,            
                code: document.getElementById('code').value,          
                time: parseInt(document.getElementById('time').value),
                remark: document.getElementById('remark').value       
            };

            try {
                // 설정한 테이블 이름(TABLE_NAME)으로 데이터를 안전하게 전송합니다.
                const { data, error } = await _supabase
                    .from(TABLE_NAME)
                    .insert([formData]);

                if (error) throw error;

                alert("작업일보가 성공적으로 등록되었습니다!");
                
                // 제출 완료 후 일부 입력창 청소
                document.getElementById('mold').value = "";
                document.getElementById('car').value = "";
                document.getElementById('part').value = "";
                document.getElementById('time').value = "";
                document.getElementById('remark').value = "";
                
            } catch (err) {
                console.error("오류 상세:", err);
                alert("등록 실패: " + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "작업일보 제출하기";
            }
        });
    </script>
</body>
</html>
