<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>로그인 · 금형공장 작업일보</title>
<link rel="stylesheet" href="/styles.css">
<script src="/security.js" defer></script><script src="/auth.js" defer></script>
</head>
<body data-page="login">
<main class="auth-shell panel">
<p class="eyebrow">WORK LOG</p><h1>금형공장 작업일보</h1>
<p class="auth-help">사번과 비밀번호로 로그인하세요.</p>
<form id="authForm" class="auth-form">
<label for="employeeNo">사번</label><input id="employeeNo" name="username" autocomplete="username" inputmode="numeric" pattern="[0-9]{9}" maxlength="9" data-ascii="true" autocapitalize="none" spellcheck="false" required placeholder="사번 9자리">
<label for="pin">비밀번호</label>
<input id="pin" name="password" type="password" autocomplete="current-password" pattern="[A-Za-z0-9]{8,32}" minlength="8" maxlength="32" data-ascii="true" autocapitalize="none" spellcheck="false" required placeholder="영문·숫자만 입력">

<button id="authButton" type="submit" class="button button-primary">로그인</button>
<p id="authMessage" role="status" aria-live="polite" class="auth-message"></p>
</form>
<p class="auth-help">초기 비밀번호는 사번과 같습니다. 로그인 후 변경하거나 변경 안내를 미룰 수 있습니다. 비밀번호를 잊으셨다면 관리자에게 초기화를 요청하세요. 공용 기기에서는 사용 후 로그아웃하세요.</p>
<noscript>로그인하려면 브라우저에서 JavaScript를 허용해 주세요.</noscript>
</main>
</body></html>
